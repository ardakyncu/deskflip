name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions: {}

jobs:
  release:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build universal app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          UNIVERSAL=1 VERSION="$VERSION" ./scripts/build-app.sh

      - name: Verify app
        run: |
          lipo -archs build/Deskflip.app/Contents/MacOS/Deskflip
          lipo build/Deskflip.app/Contents/MacOS/Deskflip -verify_arch arm64 x86_64
          codesign --verify --strict build/Deskflip.app
          plutil -p build/Deskflip.app/Contents/Info.plist

      - name: Zip app
        run: ditto -c -k --keepParent build/Deskflip.app "Deskflip-$VERSION.zip"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Universal build for Apple silicon and Intel Macs running macOS 13 or later.

          ### Install

          1. Download \`Deskflip-$VERSION.zip\` below and unzip it.
          2. Move \`Deskflip.app\` to your Applications folder and open it.

          Deskflip is not notarized by Apple, so macOS blocks it the first time you open it. To allow it, go to **System Settings → Privacy & Security** and click **Open Anyway**, or run:

          \`\`\`bash
          xattr -dr com.apple.quarantine /Applications/Deskflip.app
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" "Deskflip-$VERSION.zip" \
            --title "Deskflip $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
